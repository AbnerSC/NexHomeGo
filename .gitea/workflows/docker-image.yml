# =====================================================================
# Gitea Actions：Docker 镜像构建并推送到自建 Nexus 仓库
# （仅 linux/amd64）
#
# 与 .github/workflows/docker-image.yml 分工：
#   - GitHub 侧工作流只会被 GitHub 读取，推送到 Docker Hub
#   - 本文件只会被 Gitea Actions 读取，推送到自建 Nexus
#
# 与 Java 侧同名工作流的差异（Go 迁移点）：
#   - Maven 依赖镜像换成 GOPROXY 模块代理（加速 go mod download）
#   - 编译工具链镜像 maven 换成 golang；CGO 产物绑定目标架构，
#     本工作流仅构建 amd64（runner 原生架构），无需 QEMU
#
# 触发方式：
#   - 推送 release-v 开头的 tag（如 release-v1.2.3）自动构建，
#     推送 版本号（1.2.3）+ latest 标签
#   - 代码提交到 main 分支时自动构建，仅推送 latest 标签
#   - 支持在 Actions 页面手动触发（需 Gitea >= 1.21）：
#     选择 release-v 开头的 tag 时同样推送 版本号 + latest，
#     选择分支时仅推送 latest
#
# 前置条件：
#   - Gitea 全局环境变量（实例级或组织级/仓库级，环境变量名称不变）
#       NEXUS_REGISTRY_DOCKER   Nexus Docker 仓库地址（host[:port][/路径]，如
#                        nexus.example.com:8082 或 nexus.example.com/repository/docker-releases）
#       NEXUS_USERNAME   Nexus 账号
#       NEXUS_PASSWORD   Nexus 密码
#   - 已注册可用的 act_runner（能跑 Docker 构建；labels 与下方 runs-on 一致）
# =====================================================================
name: Docker 镜像构建（Nexus）

on:
  push:
    # 分支提交文件时自动执行Action工作流
    branches:
      - main
    # 推送 tag 时自动执行Action工作流（发布版本会自动产生一个tag）
    tags:
      - 'release-v*'
  # 手动触发Action工作流
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: nexhome-go
  # 自托管 runner 多在国内，注入 goproxy.cn 模块代理加速依赖下载（置空可关闭）
  # 若 Nexus 建有 go 模块代理仓库（如 repository/go-group），改为对应地址即可
  GOPROXY_URL: https://repo.pi.mmxx.fun/repository/go-public,direct
  # buildkit（docker-container driver）拉取镜像不走 docker daemon 的 registry-mirrors，
  # 基础镜像需显式经 Nexus 的 docker 代理仓库拉取，避免 runner 直连 docker.io 超时
  DOCKER_PROXY: repo.pi.mmxx.fun/docker-public

jobs:
  build-and-push:
    name: 构建并推送镜像到 Nexus
    # labels 必须与 act_runner 注册的标签一致（沿用 Java 侧同一 runner：
    # 任务只调用 docker CLI，编译在容器内完成，与语言环境无关）
    runs-on: golang
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 提前校验环境变量，避免构建完成后才因镜像名/登录失败报错
      - name: 检查 Nexus 配置
        shell: bash
        env:
          NEXUS_REGISTRY_DOCKER: ${{ vars.NEXUS_REGISTRY_DOCKER }}
        run: |
          if [[ -z "$NEXUS_REGISTRY_DOCKER" ]]; then
            echo "::error::未配置全局环境变量：NEXUS_REGISTRY_DOCKER（Nexus Docker 仓库地址 host[:port][/路径]）"
            exit 1
          fi
          # 镜像 tag 允许 host[:port][/仓库路径]（Nexus 路径式仓库），禁止协议前缀、首尾斜杠、大写字母等，
          # 提前校验避免构建完才报 invalid reference format
          if [[ "$NEXUS_REGISTRY_DOCKER" =~ :// || "$NEXUS_REGISTRY_DOCKER" == /* || "$NEXUS_REGISTRY_DOCKER" == */ || "$NEXUS_REGISTRY_DOCKER" == *//* || -n "${NEXUS_REGISTRY_DOCKER//[a-z0-9._\/:-]/}" ]]; then
            echo "::error::NEXUS_REGISTRY_DOCKER 必须是 host[:port][/路径] 形式（如 nexus.example.com:8082 或 nexus.example.com/repository/docker），不能包含协议前缀、首尾斜杠或大写字母"
            exit 1
          fi
          echo "Nexus 仓库地址：$NEXUS_REGISTRY_DOCKER"

      # 从 tag 解析版本号：release-v1.2.3 -> 1.2.3
      # 无论 tag 推送还是手动选择 tag 触发，只要 ref 以 release-v 开头即解析；
      # main 分支提交或手动选择分支触发时无版本号，仅推 latest
      - name: 解析版本号
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" == release-v* ]]; then
            TAG="${GITHUB_REF_NAME#release-v}"
            if [[ ! "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Tag 格式必须为 release-vX.Y.Z，实际为：${GITHUB_REF_NAME}"
              exit 1
            fi
            echo "version=$TAG" >> "$GITHUB_OUTPUT"
            echo "解析出版本号：$TAG"
          fi

      # 仅构建 linux/amd64 单架构（runner 原生架构），Go 编译阶段无需 QEMU 跨架构模拟
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
        # 若 Nexus 使用自签名证书，取消下面注释并改为实际地址，让 buildkit 放行
        # with:
        #   config-inline: |
        #     [registry."nexus.example.com:8082"]
        #       http = false
        #       insecure = true

      - name: 登录 Nexus
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.NEXUS_REGISTRY_DOCKER }}
          username: ${{ vars.NEXUS_USERNAME }}
          password: ${{ vars.NEXUS_PASSWORD }}

      # release-v 开头的 tag（推送或手动选择）：1.2.3、latest；手动选择分支：仅 latest
      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.NEXUS_REGISTRY_DOCKER }}/scdm/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ steps.version.outputs.version != '' }}
            type=raw,value=latest

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GOPROXY=${{ env.GOPROXY_URL }}
            VERSION=${{ steps.version.outputs.version }}
            GO_IMAGE=${{ env.DOCKER_PROXY }}/library/golang:1.27-bookworm
            BASE_IMAGE=${{ env.DOCKER_PROXY }}/library/debian:bookworm-slim
          # 关闭 provenance 证明，避免部分客户端拉取时出现 unknown digest
          provenance: false
          # 使用 Actions 缓存加速 go 依赖层复用
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出推送结果
        shell: bash
        run: |
          echo "已推送镜像："
          echo "${{ steps.meta.outputs.tags }}"
