<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover：iPhone 刘海/圆角屏下让页面铺到安全区边缘，再由 CSS 的 safe-area 变量补内边距 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>NexHome 联枢 · 内网节点守护工具</title>
    <!-- 移动端 PWA：可添加到主屏，theme-color 由 app.js 随浅/深主题同步 -->
    <meta name="theme-color" id="metaThemeColor" content="#eef2f8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="NexHome 联枢">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
    <script>
        /* 主题初始化：在首屏渲染前确定主题，避免浅色/深色闪屏。默认浅色，用户偏好持久化到 localStorage */
        (function () {
            try {
                var t = localStorage.getItem('nx_theme');
                if (t !== 'dark' && t !== 'light') t = 'light';
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
</head>
<body>
<!-- 登录页 -->
<div id="loginView" class="login-wrap hidden">
    <div class="login-card">
        <div class="login-logo">🏠</div>
        <h1>NexHome 联枢</h1>
        <p class="muted">一站式内网节点守护工具</p>
        <form id="loginForm">
            <input type="password" id="loginPwd" placeholder="请输入登录密码" autocomplete="current-password" required>
            <button type="submit" class="btn primary block">登 录</button>
        </form>
        <p class="muted small">首次使用默认密码查看控制台</p>
    </div>
</div>

<!-- 主界面 -->
<div id="mainView" class="layout hidden">
    <!-- 侧栏三种形态：桌面完整（文字+图标）/ 平板图标栏（768-1023，仅图标）/ 手机抽屉（<768，默认收起） -->
    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <span class="brand-logo">🏠</span><span class="brand-name">NexHome 联枢</span>
            <button type="button" class="nav-close" id="btnNavClose" aria-label="关闭菜单">✕</button>
        </div>
        <nav>
            <a class="nav-item active" data-page="dashboard" title="总览"><span class="nav-ico">📊</span><span class="nav-label">总览</span></a>
            <a class="nav-item" data-page="home" title="网站导航"><span class="nav-ico">🧭</span><span class="nav-label">网站导航</span></a>
            <a class="nav-item" data-page="ddns" title="DDNS 同步"><span class="nav-ico">🌐</span><span class="nav-label">DDNS 同步</span></a>
            <a class="nav-item" data-page="stun" title="STUN 穿透"><span class="nav-ico">🔓</span><span class="nav-label">STUN 穿透</span></a>
            <a class="nav-item" data-page="monitor" title="可用性监控"><span class="nav-ico">📡</span><span class="nav-label">可用性监控</span></a>
            <a class="nav-item" data-page="notify" title="通知中心"><span class="nav-ico">🔔</span><span class="nav-label">通知中心</span></a>
            <a class="nav-item" data-page="wol" title="WOL 唤醒"><span class="nav-ico">⚡</span><span class="nav-label">WOL 唤醒</span></a>
            <a class="nav-item" data-page="cert" title="SSL 证书"><span class="nav-ico">🔐</span><span class="nav-label">SSL 证书</span></a>
            <a class="nav-item" data-page="proxy" title="代理中心"><span class="nav-ico">🔀</span><span class="nav-label">代理中心</span></a>
            <a class="nav-item" data-page="docker" title="Docker 容器"><span class="nav-ico">🐳</span><span class="nav-label">Docker 容器</span></a>
            <a class="nav-item" data-page="logs" title="操作日志"><span class="nav-ico">📋</span><span class="nav-label">操作日志</span></a>
            <a class="nav-item" data-page="diag" title="内存监控"><span class="nav-ico">🩺</span><span class="nav-label">内存监控</span></a>
            <a class="nav-item" data-page="settings" title="系统设置"><span class="nav-ico">⚙️</span><span class="nav-label">系统设置</span></a>
        </nav>
        <div class="sidebar-foot">
            <span id="sysInfo" class="muted small"></span>
        </div>
    </aside>
    <!-- 手机抽屉遮罩：点击关闭菜单，桌面/平板不显示 -->
    <div class="nav-mask hidden" id="navMask"></div>
    <main class="content">
        <header class="topbar">
            <button type="button" class="btn icon nav-open" id="btnNavOpen" aria-label="打开菜单" title="菜单">☰</button>
            <h2 id="pageTitle">总览</h2>
            <!-- 顶栏系统资源监控（CPU / 内存 / 虚拟内存），由 app.js 每 5 秒刷新 -->
            <div id="sysMetrics" class="sys-metrics"></div>
            <div class="topbar-actions">
                <!-- 主题切换：浅色/深色双主题，默认浅色，偏好存 localStorage（app.js 驱动） -->
                <button class="btn small" id="btnTheme" title="切换浅色/深色主题">🌙 深色</button>
                <button class="btn ghost small" id="btnLogout">退出登录</button>
            </div>
        </header>
        <section id="pageBody" class="page-body"></section>
    </main>
</div>

<!-- 通用模态框 -->
<div id="modalMask" class="modal-mask hidden">
    <div class="modal" id="modalBox">
        <div class="modal-head"><span id="modalTitle"></span><span class="modal-close" id="modalClose">✕</span></div>
        <div id="modalBody" class="modal-body"></div>
    </div>
</div>

<!-- 全局确认弹窗（替代原生 confirm，由 app.js 的 confirmBox() 驱动） -->
<div id="confirmMask" class="confirm-mask hidden">
    <div class="confirm-box" role="dialog" aria-modal="true">
        <div class="confirm-icon" id="confirmIcon">❔</div>
        <div class="confirm-title" id="confirmTitle">操作确认</div>
        <div class="confirm-msg" id="confirmMsg"></div>
        <div class="confirm-actions">
            <button type="button" class="btn" id="confirmCancel">取消</button>
            <button type="button" class="btn primary" id="confirmOk">确定</button>
        </div>
    </div>
</div>

<!-- 轻提示 -->
<div id="toast" class="toast hidden"></div>

<!-- 各菜单模块脚本，须先于 app.js 加载；defer 保证按文档顺序执行且不阻塞 HTML 解析 -->
<script defer src="js/dashboard.js"></script>
<script defer src="js/home.js"></script>
<script defer src="js/ddns.js"></script>
<script defer src="js/stun.js"></script>
<script defer src="js/monitor.js"></script>
<script defer src="js/notify.js"></script>
<script defer src="js/wol.js"></script>
<script defer src="js/cert.js"></script>
<script defer src="js/proxy.js"></script>
<script defer src="js/docker.js"></script>
<script defer src="js/logs.js"></script>
<script defer src="js/diag.js"></script>
<script defer src="js/settings.js"></script>
<script defer src="app.js"></script>
</body>
</html>
